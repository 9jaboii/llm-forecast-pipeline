apiVersion: batch/v1
kind: CronJob
metadata:
  name: forecaster-daily
  namespace: {{ .Values.namespace }}
  labels: {{ include "forecaster.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.dailyCronSchedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {{ include "forecaster.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: OnFailure
          securityContext: {{ include "forecaster.securityContext.pod" . | nindent 12 }}
          containers:
            - name: daily
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["forecaster", "daily"]
              envFrom: {{ include "forecaster.envFrom" . | nindent 16 }}
              securityContext: {{ include "forecaster.securityContext.container" . | nindent 16 }}
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
          volumes:
            - { name: tmp, emptyDir: {} }
