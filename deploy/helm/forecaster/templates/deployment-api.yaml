apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecaster-api
  namespace: {{ .Values.namespace }}
  labels: {{ include "forecaster.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: forecaster-api
  template:
    metadata:
      labels:
        app: forecaster-api
        {{- include "forecaster.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: {{ include "forecaster.securityContext.pod" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "forecaster.api:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom: {{ include "forecaster.envFrom" . | nindent 12 }}
          securityContext: {{ include "forecaster.securityContext.container" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.api.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.api.port }} }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: forecaster-api
  namespace: {{ .Values.namespace }}
  labels: {{ include "forecaster.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: forecaster-api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: forecaster-api
  namespace: {{ .Values.namespace }}
  labels: {{ include "forecaster.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: forecaster-api
