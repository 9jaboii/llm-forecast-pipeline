apiVersion: v1
kind: Secret
metadata:
  name: forecaster-secrets
  namespace: {{ .Values.namespace }}
  labels: {{ include "forecaster.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Empty when FC_LLM_PROVIDER isn't "anthropic" (fake/bedrock need no key
  # here — Bedrock auth comes from the pod's IAM role, not a secret).
  FC_ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | quote }}
