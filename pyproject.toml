[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-forecast-pipeline"
version = "0.1.0"
description = "A daily LLM forecasting pipeline with a public, hash-chained track record."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Benedict Mbakogu" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "anthropic>=2.0",
  "boto3>=1.34",
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "pip-licenses>=4.4",
  "respx>=0.21",
  "freezegun>=1.5",
]
notebooks = [
  "jupyterlab>=4.1",
  "nbstripout>=0.7",
  "nbclient>=0.10",
  "matplotlib>=3.8",
  "pandas>=2.2",
]

[project.scripts]
forecaster = "forecaster.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forecaster"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
